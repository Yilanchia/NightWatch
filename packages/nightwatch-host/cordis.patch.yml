# Nightwatch's own host layer.
#
# Nightwatch is a standalone defence agent: it mounts the shared guard (one human gate) and the
# agent, and nothing else. It does not mount another project's life, persona, senses or channel.
# The only shared thing is @fairy/guard, consumed read-only from its own repository.
#
# Paths and switches come from `scripts/nightwatch.mjs`, which owns Nightwatch's home
# (.nightwatch-home). The CLI (tick/health/timeline) reads the same environment variables, so both
# entry points watch the same machine with the same configuration.

- insert:
    - id: nightwatch-guard
      name: '@fairy/guard'
      config:
        auditPath: !!js process.env.NIGHTWATCH_AUDIT_PATH
        ask: [destructive, outward, money]
    - id: nightwatch-agent
      name: '@nightwatch/agent'
      config:
        evidencePath: !!js process.env.NIGHTWATCH_EVIDENCE_PATH
        databasePath: !!js process.env.NIGHTWATCH_DB_PATH
        reportDir: !!js process.env.NIGHTWATCH_REPORT_DIR
        ports: !!js process.env.NIGHTWATCH_PORTS !== '0'
        ssh: !!js process.env.NIGHTWATCH_SSH !== '0'
        backup: !!js process.env.NIGHTWATCH_BACKUP !== '0'
        backupPaths: !!js (process.env.NIGHTWATCH_BACKUP_PATHS ?? '').split(';').filter(Boolean)
        backupStaleHours: !!js Number(process.env.NIGHTWATCH_BACKUP_STALE_HOURS ?? 36)
        observationValidHours: !!js Number(process.env.NIGHTWATCH_VALID_HOURS ?? 26)
        # Off by default: the executor is only registered when the owner explicitly enables it.
        applyFix: !!js process.env.NIGHTWATCH_APPLY_FIX === '1'
        # The interactive host keeps the framework tools; PDP would deny them, so it stays off.
        pdp: false
        # Analyst runs set NIGHTWATCH_PROJECTION=1 so evidence is redacted before the model sees it.
        projection: !!js process.env.NIGHTWATCH_PROJECTION === '1'
